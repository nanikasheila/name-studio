[package]
name = "name-model"
version = "0.1.0"
edition = "2024"
description = "ネームデータ（正本）: ページ、コマ、セリフ、線、シーン、登場人物、感情の推移"

[dependencies]
clip-core = { path = "../clip-core" }
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
clip-core = { path = "../clip-core", features = ["fixtures"] }
tempfile = "3"
