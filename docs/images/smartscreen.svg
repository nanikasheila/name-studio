<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>SmartScreen の画面の進め方（模式図）</title>
  <rect width="960" height="330" fill="#ffffff"/>
  <!-- 1 -->
  <g transform="translate(16 40)">
    <rect width="290" height="220" rx="6" fill="#1f5fa8"/>
    <text x="16" y="34" fill="#fff" font-size="15" font-weight="bold">Windows によって PC が</text>
    <text x="16" y="54" fill="#fff" font-size="15" font-weight="bold">保護されました</text>
    <text x="16" y="84" fill="#dce8f7" font-size="11">Microsoft Defender SmartScreen は</text>
    <text x="16" y="100" fill="#dce8f7" font-size="11">認識されないアプリの起動を停止しました。…</text>
    <text x="16" y="128" fill="#fff" font-size="12" text-decoration="underline">詳細情報</text>
    <rect x="10" y="112" width="70" height="24" rx="3" fill="none" stroke="#ffcf3a" stroke-width="3"/>
    <rect x="190" y="180" width="86" height="28" fill="#e9edf2"/>
    <text x="233" y="199" fill="#333" font-size="12" text-anchor="middle">実行しない</text>
  </g>
  <text x="161" y="26" font-size="14" text-anchor="middle" fill="#222">① 「詳細情報」を押す</text>
  <path d="M318 150 h30" stroke="#888" stroke-width="3" marker-end="url(#a)"/>
  <!-- 2 -->
  <g transform="translate(362 40)">
    <rect width="290" height="220" rx="6" fill="#1f5fa8"/>
    <text x="16" y="34" fill="#fff" font-size="15" font-weight="bold">Windows によって PC が</text>
    <text x="16" y="54" fill="#fff" font-size="15" font-weight="bold">保護されました</text>
    <text x="16" y="88" fill="#dce8f7" font-size="11">アプリ: NameStudio_…_x64-setup.exe</text>
    <text x="16" y="106" fill="#dce8f7" font-size="11">発行元: 不明な発行元</text>
    <rect x="92" y="180" width="86" height="28" fill="#e9edf2"/>
    <text x="135" y="199" fill="#333" font-size="12" text-anchor="middle">実行</text>
    <rect x="87" y="175" width="96" height="38" rx="3" fill="none" stroke="#ffcf3a" stroke-width="3"/>
    <rect x="190" y="180" width="86" height="28" fill="#e9edf2"/>
    <text x="233" y="199" fill="#333" font-size="12" text-anchor="middle">実行しない</text>
  </g>
  <text x="507" y="26" font-size="14" text-anchor="middle" fill="#222">② 出てきた「実行」を押す</text>
  <path d="M664 150 h30" stroke="#888" stroke-width="3" marker-end="url(#a)"/>
  <!-- 3 -->
  <g transform="translate(708 40)">
    <rect width="236" height="220" rx="6" fill="#f4f4f4" stroke="#bbb"/>
    <rect width="236" height="30" rx="6" fill="#e2e2e2"/>
    <text x="12" y="20" font-size="12" fill="#333">Name Studio セットアップ</text>
    <text x="16" y="70" font-size="12" fill="#333">インストール先を選んで</text>
    <text x="16" y="90" font-size="12" fill="#333">「インストール」</text>
    <rect x="130" y="180" width="90" height="28" fill="#2f6fdb"/>
    <text x="175" y="199" fill="#fff" font-size="12" text-anchor="middle">インストール</text>
  </g>
  <text x="826" y="26" font-size="14" text-anchor="middle" fill="#222">③ いつものセットアップ</text>
  <text x="480" y="300" font-size="12" text-anchor="middle" fill="#555">模式図です（実際の画面とは細部が違います）。出るのは、はじめてインストーラーを開くときです。</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker></defs>
</svg>
