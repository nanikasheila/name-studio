name: Release Windows app

# Every merge to main whose CI passed becomes a GitHub release with the
# Windows installer, built from the very commit CI checked (a commit whose
# tests failed is never shipped to the copies that update themselves). It is
# a 試験版 first; promote.yml makes it the 正式版 that every copy takes.
# With the updater key set up (docs/release.md), the release also carries
# latest.json and the installer's signature, and installed copies update
# themselves when they start. The installer itself is not code-signed, so
# Windows shows a SmartScreen warning on the first install.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    # By hand, or after CI passed on a push to main (not on a pull request's run).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
      # The commit CI checked (by hand: the branch's head).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Only main is released: by hand from another branch the installer is
      # built and checked but only kept as the run's artifact, so a build
      # nobody reviewed never reaches the copies that update themselves.
      PUBLISH: ${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version and update key
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node .github/scripts/release-config.mjs "$VERSION"

      - name: Build installer
        working-directory: app
        env:
          NAME_STUDIO_RELEASE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build --bundles nsis

      # The release build itself, before anyone gets it: its window opens a name
      # and writes it out for CSP (as the CI's app check does on pull requests).
      - name: A template page
        run: cargo run -p clip-core --features fixtures --example fixture_page -- "${{ runner.temp }}/app-check/page.clip"

      - name: The release build starts and writes a name out
        working-directory: app
        shell: bash
        run: node e2e/realapp.mjs "$RUNNER_TEMP/app-check"

      # What changed for the people who use the app: the pull request's
      # 「使う人への変更」 (.github/scripts/release-notes.mjs).
      - name: Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-notes.mjs "$SHA" > "$RUNNER_TEMP/notes.md"

      - name: Collect release files
        shell: bash
        run: |
          NOTES="$(cat "$RUNNER_TEMP/notes.md")" node .github/scripts/release-files.mjs "$VERSION" release

      # Every release starts as a 試験版 (a prerelease): copies set to take
      # 試験版 get it from the channel-beta release's latest.json; everyone
      # else once it is promoted to 正式版 (promote.yml) after the CSP check.
      - name: Publish release (試験版)
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" release/* \
            --title "Name Studio v$VERSION" \
            --notes-file release-notes.md \
            --target "$SHA" \
            --prerelease
          if [ -f release/latest.json ]; then
            gh release view channel-beta > /dev/null 2>&1 || gh release create channel-beta \
              --title "試験版の更新先" \
              --notes "試験版を受け取る設定のアプリが読む latest.json です（いちばん新しい試験版を指します）。版はここではなく v0.2.* の各リリースから入れてください。" \
              --target "$SHA" \
              --prerelease
            gh release upload channel-beta release/latest.json --clobber
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: name-studio-windows-installer
          path: release/*.exe
          if-no-files-found: error
