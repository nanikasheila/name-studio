name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request stops the run it makes old (nobody
# reads it). Every push to main runs to the end: a 試験版 waits for it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Python reference implementation (name_splitter/csp) used by tools/compare_with_python.py.
  REFERENCE_REF: main
  CARGO_TERM_COLOR: always

# The checks run side by side, each job as short as it can be. The Rust that
# was built is kept between runs (Swatinem/rust-cache: what main built, a pull
# request starts from) and only this repository's own crates are compiled again.
jobs:
  rust:
    name: Rust and app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Front end (type check, lint, tests, build)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Release scripts (notes, promotion)
        shell: bash
        run: node --test .github/scripts/*.test.mjs

      - name: Check formatting
        run: cargo fmt --check

      - name: Check the list of bundled libraries
        run: python3 tools/third_party.py --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build CLI
        run: cargo build --release -p name-cli

      - uses: actions/checkout@v7
        with:
          repository: nanikasheila/csp-name-splitter
          ref: ${{ env.REFERENCE_REF }}
          path: reference

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare with the Python reference
        env:
          CSP_NAME_SPLITTER: reference
          PYTHONUTF8: "1"
        run: |
          pip install -e reference
          python tools/compare_with_python.py

  browser:
    name: The app in a browser (walk-through, skill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Front end dependencies
        working-directory: app
        run: npm ci

      - name: Chromium for Playwright
        uses: ./.github/actions/playwright

      - name: Browser walk-through (open, draw, undo, errors undone, autosave, 連続, every tool against its record)
        working-directory: app
        run: npm run e2e

      - name: The name-studio skill (its script is built from the app's code and up to date, and works)
        working-directory: app
        run: |
          npm run build:skill
          git diff --exit-code -- ../skills || { echo "::error::skills/name-studio/scripts/namestudio.mjs is out of date: run npm run build:skill in app/ and commit it"; exit 1; }

  # Timings in a job of their own: nothing else runs on the machine meanwhile.
  timing:
    name: Speed, the pen and a long session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Front end dependencies
        working-directory: app
        run: npm ci

      - name: Chromium for Playwright
        uses: ./.github/actions/playwright

      - name: Speed with a heavy name (each operation within 50 ms)
        working-directory: app
        run: |
          npm run e2e:perf -- --report "$RUNNER_TEMP/perf.json"
          { echo "### 重いネームでの速さ（ms、いちばん遅いフレーム）"; echo; node -e 'const r=require(process.argv[1]);for(const[k,v]of Object.entries(r))console.log(`- ${k}: ${typeof v==="number"?v.toFixed(1):`${v.worst} / ${v.budget}`}`)' "$RUNNER_TEMP/perf.json"; } >> "$GITHUB_STEP_SUMMARY"

      - name: The pen and a long session (pressure, a long line's frames, memory and undo over a day of work)
        working-directory: app
        run: |
          npm run e2e:pen
          npm run e2e:endurance -- --report "$RUNNER_TEMP/endurance.json"
          { echo "### 長い作業でのメモリ（MB、ゴミを集めたあと）"; echo; node -e 'const r=require(process.argv[1]);for(const s of r)console.log(`- ${s.label}: ${s.heapMb} MB・canvas ${s.canvases}（${s.canvasMb} MB）・元に戻す ${s.undo}`)' "$RUNNER_TEMP/endurance.json"; } >> "$GITHUB_STEP_SUMMARY"

  app:
    name: Built app writes a name out (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On main the Windows release build checks the same (build-app.yml,
        # side by side with this run), so it is not built twice.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install

      # The same cache as the Windows release build (build-app.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the app (release, as installed)
        working-directory: app
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: A template page
        run: cargo run -p clip-core --features fixtures --example fixture_page -- "${{ runner.temp }}/app-check/page.clip"

      # The real window (WebView, Content-Security-Policy, calls to Rust) writes the pages.
      - name: Export a name for CSP with the built app
        working-directory: app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node e2e/realapp.mjs "$RUNNER_TEMP/app-check"
          else
            node e2e/realapp.mjs "$RUNNER_TEMP/app-check"
          fi

  audit:
    name: Known vulnerabilities in the Rust libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RustSec advisories against Cargo.lock: a vulnerability fails; unmaintained/unsound
      # warnings (glib, proc-macro-error under Tauri's Linux WebView) are listed only.
      - run: cargo audit
